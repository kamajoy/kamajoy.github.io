<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1e9">
  <meta name="description" content="Kamajoy 的网页游戏与互动作品">
  <title>Kamajoy · 游戏</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1e9;
      --white: #fffef9;
      --ink: #182127;
      --muted: #68737a;
      --line: #c9c4ba;
      --orange: #ef5b2a;
      --blue: #087e8b;
      --yellow: #f1ca51;
      --shadow: 0 7px 0 rgba(24, 33, 39, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      min-height: 100%;
      background: var(--paper);
    }

    body {
      min-width: 320px;
      min-height: 100dvh;
      margin: 0;
      color: var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(rgba(24, 33, 39, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(24, 33, 39, 0.04) 1px, transparent 1px);
      background-size: 28px 28px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(1100px, 100%);
      min-height: 100dvh;
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) max(22px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(22px, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 13px;
      border-bottom: 2px solid var(--ink);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 3px 3px 0 var(--ink);
      font-size: 20px;
      line-height: 1;
    }

    .brand-name {
      margin: 0;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: 0;
    }

    .site-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    main {
      flex: 1;
      padding: 54px 0 44px;
    }

    .page-heading {
      max-width: 660px;
      margin-bottom: 44px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      color: var(--orange);
      font-size: 13px;
      font-weight: 950;
    }

    .eyebrow::before {
      content: "";
      width: 18px;
      height: 4px;
      border-radius: 2px;
      background: var(--orange);
    }

    h1 {
      margin: 0;
      font-size: 42px;
      font-weight: 950;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .intro {
      max-width: 540px;
      margin: 13px 0 0;
      color: var(--muted);
      font-size: 16px;
      font-weight: 650;
      line-height: 1.7;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 15px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--ink);
    }

    h2 {
      margin: 0;
      font-size: 22px;
      font-weight: 950;
      letter-spacing: 0;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      font-weight: 850;
    }

    .game-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .game-card {
      min-width: 0;
      display: grid;
      grid-template-rows: 220px auto;
      overflow: hidden;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: var(--white);
      box-shadow: var(--shadow);
      transition: transform 140ms ease, box-shadow 140ms ease;
      touch-action: manipulation;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 11px 0 rgba(24, 33, 39, 0.18);
    }

    .game-card:active {
      transform: translateY(2px);
      box-shadow: 0 4px 0 rgba(24, 33, 39, 0.14);
    }

    .game-card:focus-visible {
      outline: 4px solid rgba(8, 126, 139, 0.35);
      outline-offset: 4px;
    }

    .game-preview {
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 72px 1fr;
      place-items: center;
      gap: 8px;
      padding: 22px;
      border-bottom: 2px solid var(--ink);
      background: #e7e1d5;
    }

    .hand-disc {
      width: 128px;
      max-width: 100%;
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 3px solid var(--ink);
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 6px 6px 0 var(--ink);
      font-size: 62px;
      line-height: 1;
      user-select: none;
    }

    .hand-disc.system {
      background: var(--orange);
    }

    .versus {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 4px 4px 0 var(--ink);
      font-size: 18px;
      font-weight: 950;
    }

    .game-body {
      min-height: 142px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 18px;
      padding: 20px;
    }

    .game-copy {
      min-width: 0;
    }

    .game-title {
      margin: 0 0 6px;
      font-size: 23px;
      font-weight: 950;
      letter-spacing: 0;
    }

    .game-description {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 650;
      line-height: 1.55;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 13px;
    }

    .tag {
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--muted);
      background: var(--paper);
      font-size: 11px;
      font-weight: 800;
    }

    .open-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--yellow);
      transition: transform 140ms ease;
    }

    .game-card:hover .open-icon {
      transform: translate(3px, -3px);
    }

    .open-icon svg {
      width: 21px;
      height: 21px;
      stroke-width: 2.4;
    }

    footer {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    @media (max-width: 840px) {
      .shell {
        padding-inline: 15px;
      }

      .site-label {
        display: none;
      }

      main {
        padding: 38px 0 34px;
      }

      .page-heading {
        margin-bottom: 34px;
      }

      h1 {
        font-size: 34px;
      }

      .game-list {
        grid-template-columns: minmax(0, 560px);
      }

      .game-card {
        grid-template-rows: 198px auto;
      }

      .hand-disc {
        width: 112px;
        font-size: 54px;
      }
    }

    @media (max-width: 420px) {
      .game-preview {
        grid-template-columns: 1fr 54px 1fr;
        gap: 3px;
        padding: 16px 10px;
      }

      .hand-disc {
        width: 94px;
        font-size: 45px;
        box-shadow: 4px 4px 0 var(--ink);
      }

      .versus {
        width: 50px;
        height: 50px;
        font-size: 15px;
      }

      .game-body {
        padding: 17px;
      }

      footer {
        flex-direction: column;
        gap: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 1ms !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Kamajoy 首页">
        <span class="brand-mark" aria-hidden="true">K</span>
        <span class="brand-name">KAMAJOY</span>
      </a>
      <span class="site-label">网页作品集</span>
    </header>

    <main>
      <div class="page-heading">
        <p class="eyebrow">PLAYGROUND</p>
        <h1>小游戏，也认真做。</h1>
        <p class="intro">这里收集可以直接在浏览器中打开的互动作品，支持电脑与 Pad。</p>
      </div>

      <section aria-labelledby="games-heading">
        <div class="section-heading">
          <h2 id="games-heading">游戏</h2>
          <span class="count">1 个作品</span>
        </div>

        <div class="game-list">
          <a class="game-card" href="./games/rock-paper-scissors/" aria-label="打开来猜拳游戏">
            <div class="game-preview" aria-hidden="true">
              <span class="hand-disc">✊</span>
              <span class="versus">VS</span>
              <span class="hand-disc system">✌️</span>
            </div>
            <div class="game-body">
              <div class="game-copy">
                <h3 class="game-title">来猜拳</h3>
                <p class="game-description">选石头、剪刀或布，与随机出拳的电脑一决胜负。</p>
                <div class="tags" aria-label="游戏特性">
                  <span class="tag">单人</span>
                  <span class="tag">触控适配</span>
                  <span class="tag">离线可玩</span>
                </div>
              </div>
              <span class="open-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M5 19 19 5"></path>
                  <path d="M9 5h10v10"></path>
                </svg>
              </span>
            </div>
          </a>
        </div>
      </section>
    </main>

    <footer>
      <span>Kamajoy Web Playground</span>
      <span>持续更新中</span>
    </footer>
  </div>
</body>
</html>
