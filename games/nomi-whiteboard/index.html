<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f7f7f5" />
    <title>Nomi 实时白板</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2320221f'/%3E%3Cpath d='M16 7l1.8 5.2L23 14l-5.2 1.8L16 21l-1.8-5.2L9 14l5.2-1.8L16 7z' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-library" aria-hidden="true">
      <defs>
        <symbol id="i-mouse-pointer-2" viewBox="0 0 24 24"><path d="m4 4 7.1 17 2.7-7.2L21 11.1Z"/><path d="m13.8 13.8 5.2 5.2"/></symbol>
        <symbol id="i-hand" viewBox="0 0 24 24"><path d="M18 11V6a2 2 0 0 0-4 0v5"/><path d="M14 10V4a2 2 0 0 0-4 0v7"/><path d="M10 9.5V6a2 2 0 0 0-4 0v8"/><path d="M6 13a2 2 0 0 0-4 0v1c0 5 3 8 8 8h2c5 0 8-3 8-8v-3a2 2 0 0 0-4 0v1"/></symbol>
        <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
        <symbol id="i-highlighter" viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-7.5 7.5-10-10L12 2Z"/></symbol>
        <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4-4 11-11 4 4Z"/><path d="m14 6 4-4 4 4-4 4"/><path d="M5 19h16"/></symbol>
        <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
        <symbol id="i-arrow-up-right" viewBox="0 0 24 24"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></symbol>
        <symbol id="i-square" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/></symbol>
        <symbol id="i-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></symbol>
        <symbol id="i-type" viewBox="0 0 24 24"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></symbol>
        <symbol id="i-sticky-note" viewBox="0 0 24 24"><path d="M15 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9Z"/><path d="M15 3v6h6"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
        <symbol id="i-undo-2" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
        <symbol id="i-redo-2" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
        <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></symbol>
        <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M5 21h14"/></symbol>
        <symbol id="i-trash-2" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 15H6L5 6"/><path d="M10 11v5M14 11v5"/></symbol>
        <symbol id="i-grid-3x3" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></symbol>
        <symbol id="i-zoom-in" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M11 8v6M8 11h6"/></symbol>
        <symbol id="i-zoom-out" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35M8 11h6"/></symbol>
        <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
        <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="m18 6-12 12M6 6l12 12"/></symbol>
        <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="m12 3-1.4 3.6L7 8l3.6 1.4L12 13l1.4-3.6L17 8l-3.6-1.4Z"/><path d="m5 14-.9 2.1L2 17l2.1.9L5 20l.9-2.1L8 17l-2.1-.9Z"/><path d="m19 14-.9 2.1L16 17l2.1.9L19 20l.9-2.1L22 17l-2.1-.9Z"/></symbol>
        <symbol id="i-stamp" viewBox="0 0 24 24"><path d="M5 22h14"/><path d="M19 18H5v-2a2 2 0 0 1 2-2h1.5l.7-3.1a3 3 0 1 1 5.6 0l.7 3.1H17a2 2 0 0 1 2 2Z"/></symbol>
        <symbol id="i-book-open" viewBox="0 0 24 24"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2Z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7Z"/></symbol>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
        <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
        <symbol id="i-panels-top-left" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
      </defs>
    </svg>

    <main class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="Nomi 白板">
          <span class="brand-mark"><svg><use href="#i-sparkles"/></svg></span>
          <span class="brand-name">Nomi</span>
        </div>
        <span class="topbar-divider"></span>
        <input id="boardTitle" class="board-title" value="未命名白板" aria-label="白板名称" maxlength="40" />

        <div class="save-state" aria-live="polite">
          <span class="save-dot"></span>
          <span id="saveLabel">已保存</span>
        </div>

        <div class="top-actions">
          <button class="icon-button" id="undoButton" type="button" aria-label="撤销" title="撤销" disabled><svg><use href="#i-undo-2"/></svg></button>
          <button class="icon-button" id="redoButton" type="button" aria-label="重做" title="重做" disabled><svg><use href="#i-redo-2"/></svg></button>
          <span class="action-divider"></span>
          <button class="action-button secondary" id="importButton" type="button" aria-label="导入白板" title="导入白板"><svg><use href="#i-upload"/></svg><span>导入</span></button>
          <button class="icon-button" id="clearButton" type="button" aria-label="清空白板" title="清空白板"><svg><use href="#i-trash-2"/></svg></button>
          <div class="export-wrap">
            <button class="action-button primary" id="exportButton" type="button" aria-haspopup="true" aria-expanded="false"><svg><use href="#i-download"/></svg><span>导出</span><svg class="chevron"><use href="#i-chevron-down"/></svg></button>
            <div id="exportMenu" class="export-menu" hidden>
              <button type="button" data-export="png"><span class="file-badge coral">PNG</span><span><b>高清图片</b><small>适合分享与展示</small></span></button>
              <button type="button" data-export="svg"><span class="file-badge green">SVG</span><span><b>矢量文件</b><small>保持图形清晰</small></span></button>
              <button type="button" data-export="json"><span class="file-badge blue">JSON</span><span><b>白板文件</b><small>稍后继续编辑</small></span></button>
            </div>
          </div>
        </div>
      </header>

      <section class="workspace" id="workspace">
        <canvas id="boardCanvas" aria-label="白板画布"></canvas>
        <div class="canvas-vignette" aria-hidden="true"></div>
        <textarea id="textEditor" class="text-editor" hidden aria-label="输入文字"></textarea>

        <nav class="tool-dock" aria-label="白板工具">
          <div class="tool-group">
            <button class="tool-button active" type="button" data-tool="select" aria-label="选择" title="选择"><svg><use href="#i-mouse-pointer-2"/></svg></button>
            <button class="tool-button" type="button" data-tool="hand" aria-label="移动画布" title="移动画布"><svg><use href="#i-hand"/></svg></button>
          </div>
          <span class="tool-divider"></span>
          <div class="tool-group">
            <button class="tool-button" type="button" data-tool="pen" aria-label="画笔" title="画笔"><svg><use href="#i-pencil"/></svg></button>
            <button class="tool-button" type="button" data-tool="highlighter" aria-label="荧光笔" title="荧光笔"><svg><use href="#i-highlighter"/></svg></button>
            <button class="tool-button" type="button" data-tool="eraser" aria-label="橡皮擦" title="橡皮擦"><svg><use href="#i-eraser"/></svg></button>
          </div>
          <span class="tool-divider"></span>
          <div class="tool-group">
            <button class="tool-button" type="button" data-tool="line" aria-label="直线" title="直线"><svg><use href="#i-minus"/></svg></button>
            <button class="tool-button" type="button" data-tool="arrow" aria-label="箭头" title="箭头"><svg><use href="#i-arrow-up-right"/></svg></button>
            <button class="tool-button" type="button" data-tool="rectangle" aria-label="矩形" title="矩形"><svg><use href="#i-square"/></svg></button>
            <button class="tool-button" type="button" data-tool="ellipse" aria-label="椭圆" title="椭圆"><svg><use href="#i-circle"/></svg></button>
          </div>
          <span class="tool-divider"></span>
          <div class="tool-group">
            <button class="tool-button" type="button" data-tool="text" aria-label="文字" title="文字"><svg><use href="#i-type"/></svg></button>
            <button class="tool-button" type="button" data-tool="sticky" aria-label="便签" title="便签"><svg><use href="#i-sticky-note"/></svg></button>
            <button class="tool-button" id="stampButton" type="button" data-tool="stamp" aria-label="图章贴纸" title="图章贴纸"><svg><use href="#i-stamp"/></svg></button>
            <button class="tool-button" id="imageButton" type="button" data-action="image" aria-label="插入图片" title="插入图片"><svg><use href="#i-image"/></svg></button>
          </div>
        </nav>

        <aside class="style-dock" aria-label="绘图样式">
          <div class="color-row" role="radiogroup" aria-label="颜色">
            <button class="color-swatch selected" type="button" data-color="#20221f" style="--swatch:#20221f" aria-label="炭黑" title="炭黑"></button>
            <button class="color-swatch" type="button" data-color="#167d5a" style="--swatch:#167d5a" aria-label="青绿" title="青绿"></button>
            <button class="color-swatch" type="button" data-color="#e85d3f" style="--swatch:#e85d3f" aria-label="珊瑚红" title="珊瑚红"></button>
            <button class="color-swatch" type="button" data-color="#3366cc" style="--swatch:#3366cc" aria-label="钴蓝" title="钴蓝"></button>
            <button class="color-swatch" type="button" data-color="#f2b84b" style="--swatch:#f2b84b" aria-label="琥珀黄" title="琥珀黄"></button>
          </div>
          <span class="style-divider"></span>
          <label class="stroke-control" title="线条粗细">
            <span id="strokePreview" class="stroke-preview"></span>
            <input id="strokeWidth" type="range" min="1" max="18" value="3" aria-label="线条粗细" />
          </label>
          <button class="fill-button" id="fillButton" type="button" aria-pressed="false" title="填充图形"><span></span><b>填充</b></button>
        </aside>

        <div class="stamp-menu floating-menu" id="stampMenu" hidden aria-label="选择图章">
          <button type="button" data-stamp="⭐" aria-label="星星图章"><span>⭐</span><b>星星</b></button>
          <button type="button" data-stamp="🌈" aria-label="彩虹图章"><span>🌈</span><b>彩虹</b></button>
          <button type="button" data-stamp="🚀" aria-label="火箭图章"><span>🚀</span><b>火箭</b></button>
          <button type="button" data-stamp="🦖" aria-label="恐龙图章"><span>🦖</span><b>恐龙</b></button>
          <button type="button" data-stamp="🐳" aria-label="鲸鱼图章"><span>🐳</span><b>鲸鱼</b></button>
          <button type="button" data-stamp="🌻" aria-label="向日葵图章"><span>🌻</span><b>花朵</b></button>
          <button type="button" data-stamp="❤️" aria-label="爱心图章"><span>❤️</span><b>爱心</b></button>
          <button type="button" data-stamp="⚽" aria-label="足球图章"><span>⚽</span><b>足球</b></button>
        </div>

        <div class="paper-menu floating-menu" id="paperMenu" hidden aria-label="选择纸张">
          <button type="button" data-paper="dots"><span class="paper-chip dots"></span><b>点阵</b></button>
          <button type="button" data-paper="blank"><span class="paper-chip blank"></span><b>白纸</b></button>
          <button type="button" data-paper="ruled"><span class="paper-chip ruled"></span><b>横线</b></button>
          <button type="button" data-paper="grid"><span class="paper-chip grid"></span><b>方格</b></button>
          <button type="button" data-paper="story"><span class="paper-chip story"></span><b>故事纸</b></button>
        </div>

        <div class="page-controls" aria-label="画本页面">
          <button class="icon-button" id="paperButton" type="button" aria-label="选择纸张" title="选择纸张"><svg><use href="#i-panels-top-left"/></svg></button>
          <span class="view-divider"></span>
          <button class="icon-button" id="prevPageButton" type="button" aria-label="上一页" title="上一页" disabled><svg><use href="#i-chevron-left"/></svg></button>
          <span class="page-label" id="pageLabel" aria-live="polite"><svg><use href="#i-book-open"/></svg><b>1 / 1</b></span>
          <button class="icon-button" id="nextPageButton" type="button" aria-label="下一页" title="下一页" disabled><svg><use href="#i-chevron-right"/></svg></button>
          <button class="icon-button accent" id="addPageButton" type="button" aria-label="新增画页" title="新增画页"><svg><use href="#i-plus"/></svg></button>
          <button class="icon-button danger" id="deletePageButton" type="button" aria-label="删除当前页" title="删除当前页" disabled><svg><use href="#i-trash-2"/></svg></button>
        </div>

        <div class="view-controls" aria-label="视图控制">
          <button class="icon-button" id="gridButton" type="button" aria-label="显示或隐藏纸张纹理" title="显示或隐藏纸张纹理" aria-pressed="true"><svg><use href="#i-grid-3x3"/></svg></button>
          <span class="view-divider"></span>
          <button class="icon-button" id="zoomOutButton" type="button" aria-label="缩小" title="缩小"><svg><use href="#i-zoom-out"/></svg></button>
          <button class="zoom-label" id="zoomResetButton" type="button" title="重置缩放">100%</button>
          <button class="icon-button" id="zoomInButton" type="button" aria-label="放大" title="放大"><svg><use href="#i-zoom-in"/></svg></button>
          <span class="view-divider"></span>
          <button class="icon-button" id="fitButton" type="button" aria-label="适应内容" title="适应内容"><svg><use href="#i-maximize"/></svg></button>
        </div>

        <div class="selection-actions" id="selectionActions" hidden>
          <button class="icon-button" id="duplicateButton" type="button" aria-label="复制所选" title="复制所选"><svg><use href="#i-copy"/></svg></button>
          <button class="icon-button danger" id="deleteButton" type="button" aria-label="删除所选" title="删除所选"><svg><use href="#i-trash-2"/></svg></button>
        </div>
      </section>
    </main>

    <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
    <input id="jsonInput" type="file" accept="application/json,.json" hidden />

    <dialog id="clearDialog" class="confirm-dialog">
      <button class="dialog-close icon-button" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
      <div class="dialog-icon"><svg><use href="#i-trash-2"/></svg></div>
      <h2>清空当前画页？</h2>
      <p>这一页的内容会被移除，你仍可以使用撤销恢复。</p>
      <div class="dialog-actions">
        <button type="button" class="action-button secondary" data-dialog="cancel">取消</button>
        <button type="button" class="action-button danger-solid" data-dialog="confirm">清空画页</button>
      </div>
    </dialog>

    <dialog id="deletePageDialog" class="confirm-dialog">
      <button class="dialog-close icon-button" type="button" aria-label="关闭"><svg><use href="#i-x"/></svg></button>
      <div class="dialog-icon"><svg><use href="#i-book-open"/></svg></div>
      <h2>删除当前画页？</h2>
      <p>这一页的图画会被删除，其他画页不会受到影响。</p>
      <div class="dialog-actions">
        <button type="button" class="action-button secondary" data-page-dialog="cancel">取消</button>
        <button type="button" class="action-button danger-solid" data-page-dialog="confirm">删除画页</button>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden>
      <svg><use href="#i-check"/></svg><span></span>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
